name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: npm exchanges this OIDC token instead of an npm token.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # The publish script compares package versions with the previous commit.
          fetch-depth: 2
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Opens a "Version packages" PR while changesets are pending, and
      # publishes once that PR is merged.
      - uses: changesets/action@v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
